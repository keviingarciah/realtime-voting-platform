name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-manifests:
    name: Validate Kubernetes Manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          wget -qO- https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate k8s manifests
        run: |
          for file in k8s/*.yaml; do
            echo "Validating $file"
            kubeconform -summary -ignore-missing-schemas "$file"
          done

  go-checks:
    name: Go Lint & Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - consumer
          - app/server
          - producer/grpc/server
          - producer/grpc/client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Vet and build
        working-directory: ${{ matrix.module }}
        run: |
          go vet ./...
          go build -o /dev/null .

  rust-checks:
    name: Rust Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - producer/rust/server
          - producer/rust/client
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install rdkafka build dependencies
        if: matrix.crate == 'producer/rust/server'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev libcurl4-openssl-dev pkg-config zlib1g-dev

      - name: Check Rust crates
        working-directory: ${{ matrix.crate }}
        run: cargo check
